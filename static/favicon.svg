<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Sound Wave Bars representing Speech Intelligence -->
  <g fill="white">
    <!-- Center - Tallest -->
    <rect x="236" y="146" width="40" height="220" rx="20" />
    
    <!-- Left side -->
    <rect x="188" y="196" width="28" height="120" rx="14" opacity="0.9" />
    <rect x="140" y="226" width="28" height="60" rx="14" opacity="0.7" />
    
    <!-- Right side -->
    <rect x="296" y="186" width="28" height="140" rx="14" opacity="0.9" />
    <rect x="344" y="221" width="28" height="70" rx="14" opacity="0.7" />
  </g>
  
  <!-- Subtle AI Pulse dots -->
  <circle cx="256" cy="110" r="10" fill="white" opacity="0.5" />
  <circle cx="256" cy="402" r="10" fill="white" opacity="0.5" />
</svg>
