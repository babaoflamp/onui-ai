{% extends "base.html" %} {% block title %}로그인 - 오누이 한국어 학습{%
endblock %} {% block content %}
<div
  class="min-h-screen bg-gradient-to-br from-orange-50 to-pink-50 flex items-center justify-center px-4"
>
  <div class="w-full max-w-md">
    <!-- Alerts Container -->
    <div id="alertsContainer" class="mb-4"></div>

    <!-- Login Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 border border-orange-100">
      <!-- Header -->
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-gray-900 mb-2">🌸 로그인</h1>
        <p class="text-gray-600">오누이 한국어 학습 플랫폼에 접속하세요</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-5">
        <!-- Email Input -->
        <div class="space-y-2">
          <label class="text-sm font-semibold text-gray-800">이메일</label>
          <input
            id="emailInput"
            name="email"
            type="email"
            required
            autocomplete="email"
            class="w-full border border-gray-200 rounded-lg px-4 py-3 focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none transition"
            placeholder="you@example.com"
          />
        </div>

        <!-- Password Input -->
        <div class="space-y-2">
          <label class="text-sm font-semibold text-gray-800">비밀번호</label>
          <input
            id="passwordInput"
            name="password"
            type="password"
            required
            autocomplete="current-password"
            class="w-full border border-gray-200 rounded-lg px-4 py-3 focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none transition"
            placeholder="••••••••"
          />
        </div>

        <!-- Submit Button -->
        <button
          id="loginBtn"
          type="submit"
          class="w-full bg-gradient-to-r from-orange-500 to-pink-500 text-white font-semibold py-3 rounded-lg shadow-lg hover:from-orange-600 hover:to-pink-600 transition-all duration-200 active:scale-95"
        >
          로그인
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-6">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-center text-sm">
          <span class="px-2 bg-white text-gray-500">또는</span>
        </div>
      </div>

      <!-- Signup Link -->
      <div class="text-center">
        <p class="text-gray-600 mb-3">아직 계정이 없으신가요?</p>
        <a
          href="/signup"
          class="inline-flex items-center justify-center text-white bg-gradient-to-r from-emerald-500 to-teal-500 px-6 py-2.5 rounded-lg font-semibold hover:from-emerald-600 hover:to-teal-600 transition-all"
        >
          회원가입하기
        </a>
      </div>

      <!-- Footer -->
      <div
        class="mt-8 pt-6 border-t border-gray-100 text-center text-xs text-gray-500"
      >
        <p>🛡️ 비밀번호는 PBKDF2로 안전하게 암호화됩니다</p>
      </div>
    </div>

    <!-- Back to Home -->
    <div class="text-center mt-6">
      <a href="/" class="text-orange-600 hover:text-orange-700 font-medium"
        >← 홈으로 돌아가기</a
      >
    </div>
  </div>
</div>
{% endblock %} {% block extra_js %}
<script>
  (function () {
    const form = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const alertsContainer = document.getElementById("alertsContainer");

    if (!form) return;

    // Clear field errors on input
    emailInput.addEventListener("input", () => {
      FormValidator.clearFieldError(emailInput);
    });
    passwordInput.addEventListener("input", () => {
      FormValidator.clearFieldError(passwordInput);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      // 유효성 검사
      alertsContainer.innerHTML = "";
      let hasErrors = false;

      if (!FormValidator.isRequired(emailInput.value)) {
        FormValidator.showFieldError(emailInput, "이메일은 필수입니다.");
        hasErrors = true;
      } else if (!FormValidator.isValidEmail(emailInput.value)) {
        FormValidator.showFieldError(emailInput, "유효한 이메일을 입력해주세요.");
        hasErrors = true;
      }

      if (!FormValidator.isRequired(passwordInput.value)) {
        FormValidator.showFieldError(passwordInput, "비밀번호는 필수입니다.");
        hasErrors = true;
      }

      if (hasErrors) {
        ToastManager.error("입력 정보를 확인해주세요.");
        return;
      }

      const payload = {
        email: emailInput.value,
        password: passwordInput.value,
      };

      LoadingManager.setButtonLoading(loginBtn, "로그인 중...");

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "로그인에 실패했습니다.");
        }

        // Store token and nickname in localStorage
        localStorage.setItem("auth_token", data.token);
        localStorage.setItem("user_nickname", data.nickname);
        const role = data.role || "";
        if (role) {
          localStorage.setItem("user_role", role);
        } else {
          localStorage.removeItem("user_role");
        }
        if (role === "system_admin") {
          localStorage.setItem("is_admin", "true");
        } else {
          localStorage.removeItem("is_admin");
        }
        localStorage.removeItem("is_guest");
        localStorage.removeItem("welcome_mail_sent");

        LoadingManager.clearButtonLoading(loginBtn);
        ToastManager.success(`${data.nickname}님 환영합니다!`);

        // Redirect after 1.5 seconds
        setTimeout(() => {
          const role = localStorage.getItem("user_role");
          if (role === "learner") {
            window.location.href = "/dashboard";
            return;
          }
          const shouldGoAdmin =
            role === "instructor" || role === "system_admin";
          window.location.href = shouldGoAdmin ? "/admin" : "/";
        }, 1500);
      } catch (err) {
        console.error("로그인 오류:", err);
        LoadingManager.clearButtonLoading(loginBtn);
        ToastManager.error(err.message || "로그인 중 오류가 발생했습니다.");
      }
    });
  })();
</script>
{% endblock %}
