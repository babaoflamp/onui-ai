{% extends "base.html" %} {% block title %}관리자 콘솔{% endblock %} {% block
content %}
<div class="min-h-[70vh] bg-gray-50 text-gray-900">
  <div
    class="max-w-7xl mx-auto px-4 lg:px-6 py-6 grid grid-cols-1 lg:grid-cols-5 gap-6"
  >
    <!-- Sidebar -->
    <aside
      class="lg:col-span-1 rounded-2xl shadow-sm bg-white border border-gray-100 p-4 sticky top-20 h-fit"
    >
      <div class="flex items-center justify-between mb-4">
        <p class="text-sm font-semibold text-gray-900">관리자 패널</p>
        <a href="/admin/login" class="text-xs text-gray-500 hover:text-gray-700"
          >계정</a
        >
      </div>
      <nav class="space-y-4 text-sm">
        <div class="space-y-1" data-roles="instructor">
          <p class="px-3 text-[11px] uppercase tracking-[0.08em] text-gray-400">
            교수
          </p>
          <a
            href="/admin/analytics?embed=1"
            target="adminFrame"
            class="block px-3 py-2 rounded-xl hover:bg-gray-100"
            >대시보드</a
          >
          <a
            href="/admin/users?embed=1"
            target="adminFrame"
            class="block px-3 py-2 rounded-xl hover:bg-gray-100"
            >사용자 관리</a
          >
          <a
            href="/admin/words?embed=1"
            target="adminFrame"
            class="block px-3 py-2 rounded-xl hover:bg-gray-100"
            >단어 관리</a
          >
          <a
            href="/admin/recordings?embed=1"
            target="adminFrame"
            class="block px-3 py-2 rounded-xl hover:bg-gray-100"
            >녹음 관리</a
          >
          <a
            href="/learning"
            target="adminFrame"
            class="block px-3 py-2 rounded-xl hover:bg-gray-100"
            >AI 콘텐츠 생성</a
          >
          <a
            href="/admin/content?embed=1"
            target="adminFrame"
            class="block px-3 py-2 rounded-xl hover:bg-gray-100"
            >AI 콘텐츠 현황</a
          >
        </div>
        <div class="space-y-1" data-roles="system_admin">
          <p class="px-3 text-[11px] uppercase tracking-[0.08em] text-gray-400">
            시스템
          </p>
          <a
            href="/admin/dashboard?embed=1"
            target="adminFrame"
            class="block px-3 py-2 rounded-xl hover:bg-gray-100"
            >대시보드</a
          >
          <a
            href="/admin/api?embed=1"
            target="adminFrame"
            class="block px-3 py-2 rounded-xl hover:bg-gray-100"
            >API 설정</a
          >
          <a
            href="/stt-api-test"
            target="adminFrame"
            class="block px-3 py-2 rounded-xl hover:bg-gray-100"
            >STT API 테스트</a
          >
          <a
            href="/admin/system?embed=1"
            target="adminFrame"
            class="block px-3 py-2 rounded-xl hover:bg-gray-100"
            >시스템 설정</a
          >
          <a
            href="/admin/logs?embed=1"
            target="adminFrame"
            class="block px-3 py-2 rounded-xl hover:bg-gray-100"
            >로그 모니터링</a
          >
          <a
            href="/admin/settings?embed=1"
            target="adminFrame"
            class="block px-3 py-2 rounded-xl hover:bg-gray-100"
            >관리자 설정</a
          >
        </div>
      </nav>
      <div class="mt-4">
        <button
          id="adminShellLogout"
          class="w-full px-3 py-2 rounded-xl bg-gradient-to-r from-orange-500 to-pink-500 text-white font-semibold shadow hover:opacity-90"
        >
          로그아웃
        </button>
      </div>
    </aside>

    <!-- Content panel -->
    <section
      class="lg:col-span-4"
    >
      <iframe
        id="adminFrame"
        name="adminFrame"
        src="/admin/dashboard?embed=1"
        class="w-full border-0 rounded-2xl shadow-sm bg-white"
        scrolling="no"
        onload="resizeIframe(this)"
      ></iframe>
    </section>
  </div>
</div>

<script>
  /**
   * Resizes the iframe to fit its content height
   */
  function resizeIframe(obj) {
    try {
      obj.style.height = 'auto'; // Reset height
      const contentHeight = obj.contentWindow.document.documentElement.scrollHeight;
      obj.style.height = (contentHeight + 20) + 'px';
    } catch (e) {
      console.warn("Could not resize iframe due to cross-origin or other error:", e);
      // Fallback if cross-origin or other error
      obj.style.height = '80vh';
    }
  }

  // Handle messages from iframe for height adjustment
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'setHeight') {
      const frame = document.getElementById('adminFrame');
      if (frame) {
        frame.style.height = e.data.height + 'px';
      }
    }
  }, false);

  // Client-side role check: redirect to admin login if missing role
  (function ensureAdmin() {
    const token = localStorage.getItem("auth_token");
    const storedRole = localStorage.getItem("user_role");
    const isAdmin = localStorage.getItem("is_admin") === "true";
    const role = storedRole || (isAdmin ? "system_admin" : "");
    const allowed = ["instructor", "system_admin"];
    if (!token || !allowed.includes(role)) {
      window.location.href = "/admin/login";
      return;
    }

    document.querySelectorAll("[data-roles]").forEach((section) => {
      const roles = section.getAttribute("data-roles") || "";
      const roleList = roles.split(",").map((r) => r.trim());
      if (!roleList.includes(role)) {
        section.classList.add("hidden");
      }
    });

    const frame = document.getElementById("adminFrame");
    const nickname = (localStorage.getItem("user_nickname") || "").toLowerCase();
    
    let defaultSrc = "/admin/dashboard?embed=1"; // Default for system_admin
    
    if (role === "instructor") {
      if (nickname === "teach") {
        defaultSrc = "/admin/analytics?embed=1";
      } else if (nickname === "teacher") {
        defaultSrc = "/admin/users?embed=1";
      } else {
        defaultSrc = "/learning"; // Generic instructor fallback
      }
    } else if (role === "system_admin") {
      defaultSrc = "/admin/dashboard?embed=1";
    }

    if (frame) {
      frame.src = defaultSrc;
    }
  })();

  // Logout handler (reuses base.js logic style)
  document
    .getElementById("adminShellLogout")
    ?.addEventListener("click", function () {
      localStorage.removeItem("auth_token");
      localStorage.removeItem("user_nickname");
      localStorage.removeItem("is_guest");
      localStorage.removeItem("is_admin");
      localStorage.removeItem("user_role");
      window.location.href = "/admin/login";
    });
</script>
{% endblock %}
