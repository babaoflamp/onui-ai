{% extends "base.html" %} {% block title %}사용자 관리 - 관리자{% endblock %} {%
block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="flex items-center justify-between mb-6">
    <div>
      <p class="text-xs font-semibold text-blue-600 uppercase tracking-widest">
        User Management
      </p>
      <h1 class="text-3xl font-bold text-gray-900 mt-1">사용자 관리</h1>
      <p class="text-gray-600 mt-2">모든 사용자 계정, 권한, 활동 확인</p>
    </div>
    <a
      href="/admin/dashboard"
      class="px-4 py-2 rounded-lg border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50"
      >← 대시보드</a
    >
  </div>

  <!-- Alerts Container -->
  <div id="alertsContainer" class="mb-6"></div>

  <!-- Search & Filter -->
  <div class="bg-white border border-gray-200 rounded-2xl p-4 mb-6 shadow-sm">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <input
        id="searchEmail"
        type="text"
        placeholder="이메일로 검색..."
        class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400"
      />
      <select
        id="filterRole"
        class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400"
      >
        <option value="">모든 역할</option>
        <option value="system_admin">시스템관리자</option>
        <option value="instructor">교수</option>
        <option value="learner">학습자</option>
      </select>
      <button
        onclick="loadUsers()"
        class="px-4 py-2 rounded-lg bg-blue-500 text-white font-semibold hover:bg-blue-600"
      >
        🔍 검색
      </button>
    </div>
  </div>

  <!-- Users Table -->
  <div
    class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden"
  >
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200 text-sm">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-4 py-3 text-left font-semibold text-gray-700">
              이메일
            </th>
            <th class="px-4 py-3 text-left font-semibold text-gray-700">
              닉네임
            </th>
            <th class="px-4 py-3 text-left font-semibold text-gray-700">
              역할
            </th>
            <th class="px-4 py-3 text-left font-semibold text-gray-700">
              가입일
            </th>
            <th class="px-4 py-3 text-center font-semibold text-gray-700">
              액션
            </th>
          </tr>
        </thead>
        <tbody id="usersTbody" class="divide-y divide-gray-100 bg-white">
          <tr>
            <td
              class="px-4 py-3 text-gray-500"
              colspan="5"
              style="text-align: center"
            >
              데이터 불러오는 중...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %} {% block extra_js %}
<script>
    (function () {
      const alertsContainer = document.getElementById("alertsContainer");
      const tbody = document.getElementById("usersTbody");
      const searchEl = document.getElementById("searchEmail");
      const filterEl = document.getElementById("filterRole");

      function ensureAdmin() {
        const token = localStorage.getItem("auth_token");
        const role =
          localStorage.getItem("user_role") ||
          (localStorage.getItem("is_admin") === "true" ? "system_admin" : "");
        const allowed = ["instructor", "system_admin"];
        if (!token || !allowed.includes(role)) {
          AlertManager.error("접근 권한이 없습니다.", "권한 오류", alertsContainer);
          setTimeout(() => (window.location.href = "/admin/login"), 800);
          return null;
        }
        return token;
      }

      window.loadUsers = async function () {
        const token = ensureAdmin();
        if (!token) return;

        alertsContainer.innerHTML = "";
        LoadingManager.show("사용자 목록을 불러오는 중...");

        try {
          const res = await fetch("/api/admin/users", {
            headers: { Authorization: `Bearer ${token}` },
          });

          if (!res.ok) {
            const error = await res.json().catch(() => ({}));
            throw new Error(error.detail || "사용자 목록을 불러오지 못했습니다.");
          }

          const data = await res.json();
          let users = data.users || [];
          const total = data.total || 0;
          const searchTerm = (searchEl.value || "").trim().toLowerCase();
          const roleFilter = (filterEl.value || "").trim();

          if (searchTerm) {
            users = users.filter((user) => {
              const email = (user.email || "").toLowerCase();
              const nickname = (user.nickname || "").toLowerCase();
              return email.includes(searchTerm) || nickname.includes(searchTerm);
            });
          }
          if (roleFilter) {
            users = users.filter((user) => {
              const userRole = user.role || (user.is_admin ? "system_admin" : "learner");
              return userRole === roleFilter;
            });
          }
  LoadingManager.hide();
          if (users.length === 0) {
            tbody.innerHTML = `<tr><td class="px-4 py-3 text-gray-500" colspan="5" style="text-align: center;">사용자가 없습니다.</td></tr>`;
            ToastManager.info(`총 ${total}명의 사용자 중 표시할 항목이 없습니다.`ay-500" colspan="5" style="text-align: center;">사용자가 없습니다.</td></tr>`;
            setStatus(`총 ${total}명의 사용자 중 표시할 항목이 없습니다.`, false);
            return;
          }

          const roleLabelMap = {
            learner: "학습자",
            instructor: "교수",
            system_admin: "시스템관리자",
          };
          const currentRole =
            localStorage.getItem("user_role") ||
            (localStorage.getItem("is_admin") === "true" ? "system_admin" : "");
          const canManage = currentRole === "system_admin";

          tbody.innerHTML = users
            .map((user) => {
              const userRole = user.role || (user.is_admin ? "system_admin" : "learner");
              const roleLabel = roleLabelMap[userRole] || "학습자";
              return `
            <tr>
              <td class="px-4 py-3 text-gray-900">${user.email}</td>
              <td class="px-4 py-3 text-gray-700">${user.nickname}</td>
              <td class="px-4 py-3">
                <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold ${
                  userRole === "system_admin"
                    ? "bg-orange-100 text-orange-800"
                    : userRole === "instructor"
                    ? "bg-blue-100 text-blue-800"
                    : "bg-gray-100 text-gray-800"
                }">
                  ${roleLabel}
                </span>
              </td>
              <td class="px-4 py-3 text-gray-500 text-xs">${
                user.created_at?.substring(0, 10) || "-"
              }</td>
              <td class="px-4 py-3 text-center">
                ${
                  canManage
                    ? `
                <div class="flex flex-wrap gap-2 justify-center items-center">
                  <select id="role-${user.id}" class="border border-gray-200 rounded px-2 py-1 text-xs">
                    <option value="learner" ${userRole === "learner" ? "selected" : ""}>학습자</option>
                    <option value="instructor" ${userRole === "instructor" ? "selected" : ""}>교수</option>
                    <option value="system_admin" ${userRole === "system_admin" ? "selected" : ""}>시스템관리자</option>
                  </select>
                  <button onclick="updateRole(${user.id})" class="px-2 py-1 rounded text-xs font-semibold bg-blue-100 text-blue-700 hover:bg-blue-200">
                    역할 저장
                  </button>
                  <button onclick="resetPassword(${user.id})" class="px-2 py-1 rounded text-xs font-semibold bg-yellow-100 text-yellow-700 hover:bg-yellow-200">
                    비번초기화
                  </button>
                </div>`
                    : `<span class="text-xs text-gray-400">권한 없음</span>`
                }
              </td>
            </tr>`
            })
          LoadingManager.hide();
          ToastManager.success(`총 ${total}명 중 ${users.length}명 표시`);
        } catch (err) {
          LoadingManager.hide();
          console.error(err);
          tbody.innerHTML = `<tr><td class="px-4 py-3 text-red-600" colspan="5" style="text-align: center;">${err.message}</td></tr>`;
          AlertManager.error(err.message, "오류", alertsContainer);
        }
      };

      window.updateRole = async function (userId) {
        const token = ensureAdmin();
        if (!token) return;

        const select = document.getElementById(`role-${userId}`);
        if (!select) return;
        const role = select.value;

        try {
          const res = await fetch(`/api/admin/users/${userId}/role`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ role }),
          });

          if (!res.ok) {
            const error = await res.json().catch(() => ({}));
            throw new Error(error.detail || "역할 변경에 실패했습니다.");
          }

          ToastManager.success("역할이 성공적으로 변경되었습니다.");
          loadUsers();
        } catch (err) {
          AlertManager.error(err.message, "오류", alertsContainer);
        }
      };

      window.resetPassword = async function (userId) {
        const token = ensureAdmin();
        if (!token) return;

        const newPwd = prompt("새 비밀번호를 입력하세요 (8자 이상):");
        if (!newPwd) return;
        
        if (newPwd.length < 8) {
          AlertManager.warning("비밀번호는 8자 이상이어야 합니다.", "입력 오류", alertsContainer);
          return;
        }

        if (!confirm("비밀번호를 초기화하시겠습니까?")) return;

        try {
          const res = await fetch(`/api/admin/users/${userId}/reset-password`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ new_password: newPwd }),
          });

          if (!res.ok) {
            const error = await res.json().catch(() => ({}));
            throw new Error(error.detail || "비밀번호 초기화에 실패했습니다.");
          }
          
          ToastManager.success("비밀번호가 초기화되었습니다.");
          loadUsers();
        } catch (err) {
          AlertManager.error(err.message, "오류", alertsContainer);
        }
      };

      loadUsers();
    })();
</script>
{% endblock %}
