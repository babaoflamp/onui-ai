{% extends "base.html" %} {% block title %}사용자 관리 - 관리자{% endblock %} {%
block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <div class="flex items-center justify-between mb-6">
    <div>
      <p class="text-xs font-semibold text-blue-600 uppercase tracking-widest">
        User Management
      </p>
      <h1 class="text-3xl font-bold text-gray-900 mt-1">사용자 관리</h1>
      <p class="text-gray-600 mt-2">모든 사용자 계정, 권한, 활동 확인</p>
    </div>
    <div class="flex gap-2">
      <button
        onclick="openUserModal()"
        class="px-4 py-2 rounded-lg bg-emerald-500 text-white font-semibold hover:bg-emerald-600 shadow-sm transition-colors"
      >
        + 사용자 추가
      </button>
      <a
        href="/admin/dashboard"
        class="px-4 py-2 rounded-lg border border-gray-200 text-sm font-semibold text-gray-700 hover:bg-gray-50"
        >← 대시보드</a
      >
    </div>
  </div>

  <!-- Alerts Container -->
  <div id="alertsContainer" class="mb-6"></div>

  <!-- Search & Filter -->
  <div class="bg-white border border-gray-200 rounded-2xl p-4 mb-6 shadow-sm">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <input
        id="searchEmail"
        type="text"
        placeholder="이름 또는 이메일로 검색..."
        class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400"
      />
      <select
        id="filterRole"
        class="border border-gray-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-400"
      >
        <option value="">모든 역할</option>
        <option value="system_admin">시스템관리자</option>
        <option value="instructor">교수</option>
        <option value="learner">학습자</option>
      </select>
      <button
        onclick="loadUsers()"
        class="px-4 py-2 rounded-lg bg-blue-500 text-white font-semibold hover:bg-blue-600"
      >
        🔍 검색
      </button>
    </div>
  </div>

  <!-- Users Table -->
  <div
    class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden"
  >
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200 text-sm">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-4 py-3 text-left font-semibold text-gray-700">
              이메일
            </th>
            <th class="px-4 py-3 text-left font-semibold text-gray-700">
              이름
            </th>
            <th class="px-4 py-3 text-left font-semibold text-gray-700">
              역할
            </th>
            <th class="px-4 py-3 text-left font-semibold text-gray-700">
              가입일
            </th>
            <th class="px-4 py-3 text-center font-semibold text-gray-700">
              액션
            </th>
          </tr>
        </thead>
        <tbody id="usersTbody" class="divide-y divide-gray-100 bg-white">
          <tr>
            <td
              class="px-4 py-3 text-gray-500"
              colspan="5"
              style="text-align: center"
            >
              데이터 불러오는 중...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- User Modal (Add/Edit) -->
<div id="userModal" class="hidden fixed inset-0 z-50 overflow-y-auto">
  <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
    <div class="fixed inset-0 transition-opacity" aria-hidden="true" onclick="closeUserModal()">
      <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
    </div>
    <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
    <div class="inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
      <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
        <div class="sm:flex sm:items-start">
          <div class="mt-3 text-center sm:mt-0 sm:ml-4 sm:text-left w-full">
            <h3 class="text-lg leading-6 font-bold text-gray-900" id="modalTitle">
              사용자 추가
            </h3>
            <div class="mt-4 space-y-4">
              <input type="hidden" id="modalUserId">
              <div>
                <label class="block text-sm font-medium text-gray-700">이름</label>
                <input type="text" id="modalUserName" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">이메일</label>
                <input type="email" id="modalUserEmail" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
              </div>
              <div id="passwordField">
                <label class="block text-sm font-medium text-gray-700">비밀번호 (기본: mz1234!@)</label>
                <input type="password" id="modalUserPassword" placeholder="기본 비밀번호가 사용됩니다" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">역할</label>
                <select id="modalUserRole" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
                  <option value="learner">학습자</option>
                  <option value="instructor">교수</option>
                  <option value="system_admin">시스템관리자</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse gap-2">
        <button type="button" onclick="saveUser()" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 focus:outline-none sm:ml-3 sm:w-auto sm:text-sm">
          저장
        </button>
        <button type="button" onclick="closeUserModal()" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
          취소
        </button>
      </div>
    </div>
  </div>
</div>

{% endblock %} {% block extra_js %}
<script>
    (function () {
      const alertsContainer = document.getElementById("alertsContainer");
      const tbody = document.getElementById("usersTbody");
      const searchEl = document.getElementById("searchEmail");
      const filterEl = document.getElementById("filterRole");
      
      const modal = document.getElementById("userModal");
      const modalTitle = document.getElementById("modalTitle");
      const modalUserId = document.getElementById("modalUserId");
      const modalUserName = document.getElementById("modalUserName");
      const modalUserEmail = document.getElementById("modalUserEmail");
      const modalUserPassword = document.getElementById("modalUserPassword");
      const modalUserRole = document.getElementById("modalUserRole");
      const passwordField = document.getElementById("passwordField");

      function ensureAdmin() {
        const token = localStorage.getItem("auth_token");
        const role =
          localStorage.getItem("user_role") ||
          (localStorage.getItem("is_admin") === "true" ? "system_admin" : "");
        const allowed = ["instructor", "system_admin"];
        if (!token || !allowed.includes(role)) {
          AlertManager.error("접근 권한이 없습니다.", "권한 오류", alertsContainer);
          setTimeout(() => (window.location.href = "/admin/login"), 800);
          return null;
        }
        return token;
      }

      window.loadUsers = async function () {
        const token = ensureAdmin();
        if (!token) return;

        alertsContainer.innerHTML = "";
        LoadingManager.show("사용자 목록을 불러오는 중...");

        try {
          const res = await fetch("/api/admin/users?limit=500", {
            headers: { Authorization: `Bearer ${token}` },
          });

          if (!res.ok) {
            const error = await res.json().catch(() => ({}));
            throw new Error(error.detail || "사용자 목록을 불러오지 못했습니다.");
          }

          const data = await res.json();
          let users = data.users || [];
          const total = data.total || 0;
          const searchTerm = (searchEl.value || "").trim().toLowerCase();
          const roleFilter = (filterEl.value || "").trim();

          if (searchTerm) {
            users = users.filter((user) => {
              const email = (user.email || "").toLowerCase();
              const name = (user.name || user.nickname || "").toLowerCase();
              return email.includes(searchTerm) || name.includes(searchTerm);
            });
          }
          if (roleFilter) {
            users = users.filter((user) => {
              const userRole = user.role || (user.is_admin ? "system_admin" : "learner");
              return userRole === roleFilter;
            });
          }

          LoadingManager.hide();

          if (users.length === 0) {
            tbody.innerHTML = `<tr><td class="px-4 py-3 text-gray-500" colspan="5" style="text-align: center;">사용자가 없습니다.</td></tr>`;
            return;
          }

          const roleLabelMap = {
            learner: "학습자",
            instructor: "교수",
            system_admin: "시스템관리자",
          };
          const currentRole =
            localStorage.getItem("user_role") ||
            (localStorage.getItem("is_admin") === "true" ? "system_admin" : "");
          const canManage = ["instructor", "system_admin"].includes(currentRole);

          tbody.innerHTML = users
            .map((user) => {
              const userRole = user.role || (user.is_admin ? "system_admin" : "learner");
              const roleLabel = roleLabelMap[userRole] || "학습자";
              return `
            <tr>
              <td class="px-4 py-3 text-gray-900">${user.email}</td>
              <td class="px-4 py-3 text-gray-700">${user.name || user.nickname || "-"}</td>
              <td class="px-4 py-3">
                <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold ${
                  userRole === "system_admin"
                    ? "bg-orange-100 text-orange-800"
                    : userRole === "instructor"
                    ? "bg-blue-100 text-blue-800"
                    : "bg-gray-100 text-gray-800"
                }">
                  ${roleLabel}
                </span>
              </td>
              <td class="px-4 py-3 text-gray-500 text-xs">${
                user.created_at?.substring(0, 10) || "-"
              }</td>
              <td class="px-4 py-3 text-center">
                <div class="flex flex-wrap gap-2 justify-center items-center">
                  ${
                    canManage
                      ? `
                  <button onclick='openUserModal(${JSON.stringify(user).replace(/'/g, "&apos;")})' class="px-2 py-1 rounded text-xs font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200">
                    수정
                  </button>
                  <button onclick="updateRole(${user.id})" class="px-2 py-1 rounded text-xs font-semibold bg-blue-100 text-blue-700 hover:bg-blue-200">
                    역할 저장
                  </button>
                  <button onclick="resetPassword(${user.id})" class="px-2 py-1 rounded text-xs font-semibold bg-yellow-100 text-yellow-700 hover:bg-yellow-200">
                    비번초기화
                  </button>
                  <button onclick="deleteUser(${user.id})" class="px-2 py-1 rounded text-xs font-semibold bg-red-100 text-red-700 hover:bg-red-200">
                    삭제
                  </button>
                  <select id="role-${user.id}" class="border border-gray-200 rounded px-2 py-1 text-xs">
                    <option value="learner" ${userRole === "learner" ? "selected" : ""}>학습자</option>
                    <option value="instructor" ${userRole === "instructor" ? "selected" : ""}>교수</option>
                    <option value="system_admin" ${userRole === "system_admin" ? "selected" : ""}>시스템관리자</option>
                  </select>
                  `
                      : `<span class="text-xs text-gray-400">조회 전용</span>`
                  }
                </div>
              </td>
            </tr>`;
            })
            .join("");
          
          ToastManager.success(`총 ${total}명 중 ${users.length}명 표시`);
        } catch (err) {
          LoadingManager.hide();
          console.error(err);
          tbody.innerHTML = `<tr><td class="px-4 py-3 text-red-600" colspan="5" style="text-align: center;">${err.message}</td></tr>`;
          AlertManager.error(err.message, "오류", alertsContainer);
        }
      };

      window.openUserModal = function(user = null) {
        if (user) {
          modalTitle.textContent = "사용자 수정";
          modalUserId.value = user.id;
          modalUserName.value = user.name || user.nickname || "";
          modalUserEmail.value = user.email || "";
          modalUserRole.value = user.role || (user.is_admin ? "system_admin" : "learner");
          passwordField.classList.add("hidden");
        } else {
          modalTitle.textContent = "사용자 추가";
          modalUserId.value = "";
          modalUserName.value = "";
          modalUserEmail.value = "";
          modalUserPassword.value = "";
          modalUserRole.value = "learner";
          passwordField.classList.remove("hidden");
        }
        modal.classList.remove("hidden");
      };

      window.closeUserModal = function() {
        modal.classList.add("hidden");
      };

      window.saveUser = async function() {
        const token = ensureAdmin();
        if (!token) return;

        const userId = modalUserId.value;
        const name = modalUserName.value.trim();
        const email = modalUserEmail.value.trim();
        const role = modalUserRole.value;
        const password = modalUserPassword.value;

        if (!name || !email) {
          ToastManager.error("이름과 이메일을 입력하세요.");
          return;
        }

        try {
          let res;
          if (userId) {
            // Update (PATCH)
            res = await fetch(`/api/admin/users/${userId}`, {
              method: "PATCH",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ name, email }),
            });
            // Also update role if changed (separate API call based on current implementation)
            await fetch(`/api/admin/users/${userId}/role`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ role }),
            });
          } else {
            // Create (POST)
            res = await fetch(`/api/admin/users`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ name, email, role, password }),
            });
          }

          if (!res.ok) {
            const error = await res.json().catch(() => ({}));
            throw new Error(error.detail || "작업에 실패했습니다.");
          }

          ToastManager.success(userId ? "수정되었습니다." : "추가되었습니다.");
          closeUserModal();
          loadUsers();
        } catch (err) {
          AlertManager.error(err.message, "오류", alertsContainer);
        }
      };

      window.updateRole = async function (userId) {
        const token = ensureAdmin();
        if (!token) return;

        const select = document.getElementById(`role-${userId}`);
        if (!select) return;
        const role = select.value;

        try {
          const res = await fetch(`/api/admin/users/${userId}/role`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ role }),
          });

          if (!res.ok) {
            const error = await res.json().catch(() => ({}));
            throw new Error(error.detail || "역할 변경에 실패했습니다.");
          }

          ToastManager.success("역할이 성공적으로 변경되었습니다.");
          loadUsers();
        } catch (err) {
          AlertManager.error(err.message, "오류", alertsContainer);
        }
      };

      window.resetPassword = async function (userId) {
        const token = ensureAdmin();
        if (!token) return;

        const newPwd = prompt("새 비밀번호를 입력하세요 (8자 이상):");
        if (!newPwd) return;
        
        if (newPwd.length < 8) {
          AlertManager.warning("비밀번호는 8자 이상이어야 합니다.", "입력 오류", alertsContainer);
          return;
        }

        if (!confirm("비밀번호를 초기화하시겠습니까?")) return;

        try {
          const res = await fetch(`/api/admin/users/${userId}/reset-password`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({ new_password: newPwd }),
          });

          if (!res.ok) {
            const error = await res.json().catch(() => ({}));
            throw new Error(error.detail || "비밀번호 초기화에 실패했습니다.");
          }
          
          ToastManager.success("비밀번호가 초기화되었습니다.");
          loadUsers();
        } catch (err) {
          AlertManager.error(err.message, "오류", alertsContainer);
        }
      };

      window.deleteUser = async function(userId) {
        const token = ensureAdmin();
        if (!token) return;

        if (!confirm("정말로 이 사용자를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.")) return;

        try {
          const res = await fetch(`/api/admin/users/${userId}`, {
            method: "DELETE",
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          if (!res.ok) {
            const error = await res.json().catch(() => ({}));
            throw new Error(error.detail || "삭제에 실패했습니다.");
          }

          ToastManager.success("삭제되었습니다.");
          loadUsers();
        } catch (err) {
          AlertManager.error(err.message, "오류", alertsContainer);
        }
      };

      loadUsers();
    })();
</script>
{% endblock %}
