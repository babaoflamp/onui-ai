{% extends "base.html" %} {% block title %}회원가입 | 오누이 한국어{% endblock
%} {% block content %}
<div class="max-w-md mx-auto px-4 py-10">
  <!-- Header -->
  <div class="mb-8 text-center">
    <div
      class="inline-flex items-center gap-2 px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-semibold mb-3"
    >
      <span class="w-2 h-2 bg-blue-500 rounded-full"></span>
      ONUI · 계정 만들기
    </div>
    <h1 class="text-3xl font-bold text-gray-900">회원가입</h1>
    <p class="text-sm text-gray-600 mt-1">
      오누이 한국어 계정을 만들어 학습을 시작하세요
    </p>
  </div>

  <!-- Signup Card -->
  <div class="bg-white rounded-2xl p-6 shadow-lg">
    <form id="signupForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="name"
          >이름</label
        >
        <input
          id="name"
          name="name"
          type="text"
          required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF8C1A]"
          placeholder="홍길동"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="email"
          >이메일</label
        >
        <input
          id="email"
          name="email"
          type="email"
          required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF8C1A]"
          placeholder="you@example.com"
        />
      </div>
      <div>
        <label
          class="block text-sm font-medium text-gray-700 mb-1"
          for="nickname"
          >닉네임</label
        >
        <input
          id="nickname"
          name="nickname"
          type="text"
          required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF8C1A]"
          placeholder="your_nickname"
        />
      </div>
      <div>
        <label
          class="block text-sm font-medium text-gray-700 mb-1"
          for="password"
          >비밀번호</label
        >
        <input
          id="password"
          name="password"
          type="password"
          required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF8C1A]"
          placeholder="8자 이상"
        />
      </div>
      <div>
        <label
          class="block text-sm font-medium text-gray-700 mb-1"
          for="confirm_password"
          >비밀번호 확인</label
        >
        <input
          id="confirm_password"
          name="confirm_password"
          type="password"
          required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF8C1A]"
          placeholder="비밀번호 다시 입력"
        />
      </div>

      <button
        type="submit"
        class="w-full mt-2 px-4 py-2 bg-[#FF8C1A] border-2 border-[#FF8C1A] text-white rounded-lg font-bold hover:bg-[#e67a15] transition"
      >
        회원가입
      </button>
    </form>

    <div class="mt-4 text-center text-sm text-gray-600">
      이미 계정이 있으신가요?
      <a href="/login" class="text-[#FF8C1A] font-semibold hover:underline"
        >로그인</a
      >
    </div>
  </div>

  <script>
    document
      .getElementById("signupForm")
      .addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value;
        const email = document.getElementById("email").value;
        const nickname = document.getElementById("nickname").value;
        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirm_password").value;

        if (password !== confirmPassword) {
          alert("비밀번호가 일치하지 않습니다");
          return;
        }

        if (password.length < 8) {
          alert("비밀번호는 8자 이상이어야 합니다");
          return;
        }

        try {
          const response = await fetch("/api/signup", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              name: name,
              email: email,
              nickname: nickname,
              password: password,
            }),
          });

          const data = await response.json();

          if (response.ok) {
            alert("회원가입이 완료되었습니다. 로그인해주세요.");
            window.location.href = "/login";
          } else {
            alert(data.detail || "회원가입 실패");
          }
        } catch (error) {
          console.error("Error:", error);
          alert("오류가 발생했습니다");
        }
      });
  </script>
</div>
{% endblock %}
