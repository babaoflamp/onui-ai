{% extends "base.html" %} {% block title %}회원가입 | 오누이 한국어{% endblock
%} {% block content %}
<div class="max-w-md mx-auto px-4 py-10">
  <!-- Header -->
  <div class="mb-8 text-center">
    <div
      class="inline-flex items-center gap-2 px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-semibold mb-3"
    >
      <span class="w-2 h-2 bg-blue-500 rounded-full"></span>
      ONUI · 계정 만들기
    </div>
    <h1 class="text-3xl font-bold text-gray-900">회원가입</h1>
    <p class="text-sm text-gray-600 mt-1">
      오누이 한국어 계정을 만들어 학습을 시작하세요
    </p>
  </div>

  <!-- Signup Card -->
  <div class="bg-white rounded-2xl p-6 shadow-lg">
    <!-- Alerts Container -->
    <div id="alertsContainer" class="mb-4"></div>

    <form id="signupForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="name"
          >이름</label
        >
        <input
          id="name"
          name="name"
          type="text"
          required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF8C1A]"
          placeholder="홍길동"
        />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1" for="email"
          >이메일</label
        >
        <input
          id="email"
          name="email"
          type="email"
          required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF8C1A]"
          placeholder="you@example.com"
        />
      </div>
      <div>
        <label
          class="block text-sm font-medium text-gray-700 mb-1"
          for="nickname"
          >닉네임</label
        >
        <input
          id="nickname"
          name="nickname"
          type="text"
          required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF8C1A]"
          placeholder="your_nickname"
        />
      </div>
      <div>
        <label
          class="block text-sm font-medium text-gray-700 mb-1"
          for="password"
          >비밀번호</label
        >
        <input
          id="password"
          name="password"
          type="password"
          required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF8C1A]"
          placeholder="8자 이상"
        />
      </div>
      <div>
        <label
          class="block text-sm font-medium text-gray-700 mb-1"
          for="confirm_password"
          >비밀번호 확인</label
        >
        <input
          id="confirm_password"
          name="confirm_password"
          type="password"
          required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#FF8C1A]"
          placeholder="비밀번호 다시 입력"
        />
      </div>

      <button
        id="signupBtn"
        type="submit"
        class="w-full mt-2 px-4 py-2 bg-[#FF8C1A] border-2 border-[#FF8C1A] text-white rounded-lg font-bold hover:bg-[#e67a15] transition"
      >
        회원가입
      </button>
    </form>

    <div class="mt-4 text-center text-sm text-gray-600">
      이미 계정이 있으신가요?
      <a href="/login" class="text-[#FF8C1A] font-semibold hover:underline"
        >로그인</a
      >
    </div>
  </div>

  <script>
    (function () {
      const form = document.getElementById("signupForm");
      const signupBtn = document.getElementById("signupBtn");
      const nameInput = document.getElementById("name");
      const emailInput = document.getElementById("email");
      const nicknameInput = document.getElementById("nickname");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirm_password");
      const alertsContainer = document.getElementById("alertsContainer");

      // Clear field errors on input
      const inputs = [
        nameInput,
        emailInput,
        nicknameInput,
        passwordInput,
        confirmPasswordInput,
      ];
      inputs.forEach((input) => {
        input.addEventListener("input", () => {
          FormValidator.clearFieldError(input);
        });
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        // 유효성 검사
        alertsContainer.innerHTML = "";
        let hasErrors = false;

        if (!FormValidator.isRequired(nameInput.value)) {
          FormValidator.showFieldError(nameInput, "이름은 필수입니다.");
          hasErrors = true;
        }

        if (!FormValidator.isRequired(emailInput.value)) {
          FormValidator.showFieldError(emailInput, "이메일은 필수입니다.");
          hasErrors = true;
        } else if (!FormValidator.isValidEmail(emailInput.value)) {
          FormValidator.showFieldError(
            emailInput,
            "유효한 이메일을 입력해주세요."
          );
          hasErrors = true;
        }

        if (!FormValidator.isRequired(nicknameInput.value)) {
          FormValidator.showFieldError(nicknameInput, "닉네임은 필수입니다.");
          hasErrors = true;
        }

        if (!FormValidator.isRequired(passwordInput.value)) {
          FormValidator.showFieldError(passwordInput, "비밀번호는 필수입니다.");
          hasErrors = true;
        } else if (!FormValidator.minLength(passwordInput.value, 8)) {
          FormValidator.showFieldError(
            passwordInput,
            "비밀번호는 8자 이상이어야 합니다."
          );
          hasErrors = true;
        }

        if (passwordInput.value !== confirmPasswordInput.value) {
          FormValidator.showFieldError(
            confirmPasswordInput,
            "비밀번호가 일치하지 않습니다."
          );
          hasErrors = true;
        }

        if (hasErrors) {
          AlertManager.error(
            "입력 정보를 확인해주세요.",
            "유효성 검사 오류",
            alertsContainer
          );
          return;
        }

        LoadingManager.setButtonLoading(signupBtn, "가입 중...");

        try {
          const response = await fetch("/api/signup", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              name: nameInput.value,
              email: emailInput.value,
              nickname: nicknameInput.value,
              password: passwordInput.value,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.detail || "회원가입에 실패했습니다.");
          }

          LoadingManager.clearButtonLoading(signupBtn);
          ToastManager.success("회원가입이 완료되었습니다.");

          setTimeout(() => {
            window.location.href = "/login";
          }, 1500);
        } catch (error) {
          console.error("회원가입 오류:", error);
          LoadingManager.clearButtonLoading(signupBtn);
          AlertManager.error(
            error.message || "오류가 발생했습니다.",
            "회원가입 실패",
            alertsContainer
          );
        }
      });
    })();
  </script>
</div>
{% endblock %}
