{% extends "base.html" %} {% block title %}학생 녹음 확인 - 관리자{%
endblock %} {% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <div class="bg-white rounded-lg shadow-lg p-6">
    <h1 class="text-3xl font-bold text-gray-900 mb-6">🎙️ 학생 녹음 확인</h1>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-blue-50 rounded-lg p-4">
        <p class="text-gray-600 text-sm">전체 녹음 수</p>
        <p class="text-3xl font-bold text-blue-600" id="total-recordings">0</p>
      </div>
      <div class="bg-green-50 rounded-lg p-4">
        <p class="text-gray-600 text-sm">오늘 녹음</p>
        <p class="text-3xl font-bold text-green-600" id="today-recordings">0</p>
      </div>
      <div class="bg-orange-50 rounded-lg p-4">
        <p class="text-gray-600 text-sm">평균 길이</p>
        <p class="text-3xl font-bold text-orange-600" id="avg-length">0초</p>
      </div>
      <div class="bg-purple-50 rounded-lg p-4">
        <p class="text-gray-600 text-sm">총 저장소</p>
        <p class="text-3xl font-bold text-purple-600" id="total-size">0MB</p>
      </div>
    </div>

    <div class="border-t pt-6">
      <h2 class="text-xl font-semibold text-gray-900 mb-4">최근 녹음</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full border-collapse border border-gray-300">
          <thead class="bg-gray-100">
            <tr>
              <th class="border border-gray-300 px-4 py-2 text-left">사용자</th>
              <th class="border border-gray-300 px-4 py-2 text-left">문장</th>
              <th class="border border-gray-300 px-4 py-2 text-left">길이</th>
              <th class="border border-gray-300 px-4 py-2 text-left">
                저장 시간
              </th>
              <th class="border border-gray-300 px-4 py-2 text-center">작업</th>
            </tr>
          </thead>
          <tbody id="recordings-table">
            <tr>
              <td
                colspan="5"
                class="border border-gray-300 px-4 py-2 text-center text-gray-500"
              >
                녹음 데이터를 불러오는 중입니다...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  // 역할 권한 확인
  function checkAdminAccess() {
    const role =
      localStorage.getItem("user_role") ||
      (localStorage.getItem("is_admin") === "true" ? "system_admin" : "");
    const allowed = ["instructor", "system_admin"];
    if (!allowed.includes(role)) {
      AlertManager.error("접근 권한이 없습니다.", "권한 오류", document.body);
      window.location.href = "/admin/login";
    }
  }

  // 녹음 데이터 로드
  async function loadRecordings() {
    const tableBody = document.getElementById("recordings-table");
    const alertsContainer = document.body;

    try {
      checkAdminAccess();
      const token = localStorage.getItem("auth_token");
      if (!token) throw new Error("로그인이 필요합니다.");

      const response = await fetch("/api/admin/recordings?limit=50", {
        headers: { Authorization: `Bearer ${token}` },
      });

      if (!response.ok) {
        throw new Error("녹음 데이터를 불러오지 못했습니다.");
      }

      const data = await response.json();
      const stats = data.stats || {};
      const recordings = data.recordings || [];

      // Update stats
      document.getElementById("total-recordings").textContent = stats.total || 0;
      document.getElementById("today-recordings").textContent = stats.today || 0;
      document.getElementById("avg-length").textContent = `${stats.avg_length || 0}초`;
      document.getElementById("total-size").textContent = `${stats.total_size || 0}MB`;

      if (recordings.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="5" class="border border-gray-300 px-4 py-2 text-center text-gray-500">
              최근 녹음 내역이 없습니다.
            </td>
          </tr>
        `;
        return;
      }

      tableBody.innerHTML = recordings
        .map(
          (r) => `
          <tr class="hover:bg-gray-50">
            <td class="border border-gray-300 px-4 py-3 text-sm font-medium text-gray-900">${r.user}</td>
            <td class="border border-gray-300 px-4 py-3 text-sm text-gray-700">${r.sentence}</td>
            <td class="border border-gray-300 px-4 py-3 text-sm text-center">
              <span class="px-2 py-1 bg-green-100 text-green-800 rounded-full font-bold">${r.score}점</span>
            </td>
            <td class="border border-gray-300 px-4 py-3 text-sm text-gray-500">${r.created_at.substring(0, 16).replace("T", " ")}</td>
            <td class="border border-gray-300 px-4 py-3 text-center">
              ${r.audio_path ? `
                <button class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 transition text-xs flex items-center gap-1 mx-auto" onclick="playAudio('${r.audio_path}')">
                  <span>▶</span> 재생
                </button>
              ` : `
                <span class="text-xs text-gray-400 italic">파일 없음</span>
              `}
            </td>
          </tr>
        `
        )
        .join("");
    } catch (error) {
      console.error("Error loading recordings:", error);
      tableBody.innerHTML = `
        <tr>
          <td colspan="5" class="border border-gray-300 px-4 py-2 text-center text-red-500 font-medium">
            ${error.message}
          </td>
        </tr>
      `;
    }
  }

  // 오디오 재생 함수
  function playAudio(path) {
    if (!path) return;
    
    // 경로 처리 (/uploads/... 형태 보장)
    let url = path;
    if (!url.startsWith('/')) {
      url = '/' + url;
    }
    
    const audio = new Audio(url);
    audio.play().catch(err => {
      console.error("Playback failed:", err);
      AlertManager.error("오디오 파일을 재생할 수 없습니다. 파일이 존재하지 않거나 형식이 올바르지 않습니다.");
    });
  }

  document.addEventListener("DOMContentLoaded", loadRecordings);
</script>
{% endblock %}
