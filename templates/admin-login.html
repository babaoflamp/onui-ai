{% extends "base.html" %} {% block title %}관리자 로그인 - 오누이 한국어{%
endblock %} {% block content %}
<div
  class="min-h-screen bg-gradient-to-br from-slate-50 via-white to-orange-50 flex items-center justify-center px-4 py-10"
>
  <div class="w-full max-w-md">
    <div class="bg-white border border-slate-200 shadow-2xl rounded-3xl p-8">
      <div class="text-center mb-8">
        <p
          class="text-xs font-semibold text-orange-600 uppercase tracking-widest"
        >
          Admin Access
        </p>
        <h1 class="text-3xl font-bold text-gray-900 mt-2">관리자 로그인</h1>
        <p class="text-gray-600 mt-2">관리자만 접근 가능한 영역입니다.</p>
      </div>

      <form id="adminLoginForm" class="space-y-5">
        <div class="space-y-2">
          <label class="text-sm font-semibold text-gray-800">이메일</label>
          <input
            name="email"
            type="email"
            required
            autocomplete="email"
            class="w-full border border-gray-200 rounded-lg px-4 py-3 focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none transition"
            placeholder="admin@example.com"
          />
        </div>

        <div class="space-y-2">
          <label class="text-sm font-semibold text-gray-800">비밀번호</label>
          <input
            name="password"
            type="password"
            required
            autocomplete="current-password"
            class="w-full border border-gray-200 rounded-lg px-4 py-3 focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none transition"
            placeholder="••••••••"
          />
        </div>

        <div
          id="adminLoginStatus"
          class="text-sm text-center min-h-6 text-gray-600"
        ></div>

        <button
          type="submit"
          class="w-full bg-gradient-to-r from-slate-900 to-slate-700 text-white font-semibold py-3 rounded-lg shadow-lg hover:from-slate-800 hover:to-slate-600 transition-all duration-200 active:scale-95"
        >
          관리자 로그인
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-gray-500">
        <p>일반 사용자 계정으로는 접근할 수 없습니다.</p>
        <a
          href="/login"
          class="text-orange-600 font-semibold hover:text-orange-700"
          >일반 로그인으로 이동 →</a
        >
      </div>
    </div>
  </div>
</div>
{% endblock %} {% block extra_js %}
<script>
  (function () {
    const form = document.getElementById("adminLoginForm");
    const statusEl = document.getElementById("adminLoginStatus");
    if (!form) return;

    function setStatus(msg, ok = true) {
      if (!statusEl) return;
      statusEl.textContent = msg;
      statusEl.className = ok
        ? "text-sm text-emerald-600 font-medium text-center"
        : "text-sm text-red-600 font-medium text-center";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const payload = {
        email: fd.get("email") || "",
        password: fd.get("password") || "",
      };

      setStatus("로그인 중...", true);

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!res.ok) {
          const error = await res
            .json()
            .catch(() => ({ detail: "로그인 실패" }));
          throw new Error(error.detail || "로그인에 실패했습니다.");
        }

        const data = await res.json();
        const role = data.role || "";
        const allowed = ["instructor", "system_admin"];
        if (!allowed.includes(role)) {
          throw new Error("접근 권한이 없습니다.");
        }

        localStorage.setItem("auth_token", data.token);
        localStorage.setItem("user_nickname", data.nickname);
        localStorage.setItem("user_role", role);
        if (role === "system_admin") {
          localStorage.setItem("is_admin", "true");
        } else {
          localStorage.removeItem("is_admin");
        }
        localStorage.removeItem("is_guest");
        setStatus(`✓ ${data.nickname}님 환영합니다!`);

        setTimeout(() => {
          window.location.href = "/admin";
        }, 1000);
      } catch (err) {
        console.error(err);
        setStatus(err.message || "로그인 중 오류가 발생했습니다.", false);
      }
    });
  })();
</script>
{% endblock %}
