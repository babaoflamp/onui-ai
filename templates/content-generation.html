{% extends "base.html" %}
{% block title %}AI 레슨 메이커 - 오누이 한국어{% endblock %}

{% block extra_css %}
<style>
  /* ── 전체 페이지 높이 고정 (스크롤 없음) ── */
  #main-content { padding: 16px 24px !important; }

  .tb-app {
    height: calc(100vh - 100px);
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 12px;
  }

  /* ── 공통 패널 ── */
  .tb-panel {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .tb-panel-header {
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  .tb-panel-header h2 {
    font-size: 10px;
    font-weight: 900;
    color: rgba(255,255,255,0.3);
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .tb-scroll { flex: 1; overflow-y: auto; padding: 16px; }
  .tb-scroll::-webkit-scrollbar { width: 4px; }
  .tb-scroll::-webkit-scrollbar-track { background: transparent; }
  .tb-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

  /* ── 좌측: input + 결과 ── */
  .config-row {
    display: grid;
    grid-template-columns: 1fr 110px 130px;
    gap: 8px;
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .config-row input, .config-row select {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }
  .config-row input:focus, .config-row select:focus { border-color: rgba(249,115,22,0.5); }
  .config-row select { cursor: pointer; }
  .gen-btn {
    background: linear-gradient(135deg, #f97316, #ec4899);
    color: white;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 10px;
  }
  .gen-btn:hover { opacity: 0.9; transform: scale(1.02); }
  .gen-btn:active { transform: scale(0.97); }
  .gen-btn.stop { background: rgba(239,68,68,0.8); }

  /* ── 대화 카드 ── */
  .dialogue-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
    transition: all 0.3s;
  }
  .dialogue-card.playing {
    border-color: rgba(249,115,22,0.4);
    background: rgba(249,115,22,0.06);
    border-left: 3px solid #f97316;
  }
  .dialogue-card .speaker { font-size: 9px; font-weight: 900; color: rgba(255,255,255,0.25); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 4px; }
  .dialogue-card .d-text { font-size: 14px; font-weight: 700; color: white; line-height: 1.5; }
  .dialogue-card .d-pron { font-size: 11px; color: rgba(255,255,255,0.35); font-style: italic; margin-top: 4px; }
  .tts-btn { width: 24px; height: 24px; border-radius: 50%; background: rgba(255,255,255,0.05); border: none; cursor: pointer; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; margin-right: 6px; transition: background 0.2s; flex-shrink: 0; }
  .tts-btn:hover { background: #f97316; }

  /* ── 단어 태그 ── */
  .vocab-tag {
    display: inline-block;
    background: rgba(249,115,22,0.12);
    border: 1px solid rgba(249,115,22,0.25);
    color: #fb923c;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 700;
    margin: 3px;
  }

  /* ── 액션 버튼 바 ── */
  .action-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 10px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .action-btn {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    color: rgba(255,255,255,0.6);
    font-size: 11px;
    font-weight: 800;
    padding: 8px 4px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    line-height: 1.2;
  }
  .action-btn:hover { background: rgba(249,115,22,0.15); border-color: rgba(249,115,22,0.3); color: #fb923c; }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .action-btn span:first-child { font-size: 16px; }

  /* ── 코치 채팅 ── */
  .coach-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .coach-scroll::-webkit-scrollbar { width: 4px; }
  .coach-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
  .coach-bubble-ai { display: flex; gap: 8px; align-items: flex-start; }
  .coach-bubble-user { display: flex; justify-content: flex-end; }
  .bubble-ai-text { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px 14px 14px 4px; padding: 10px 14px; font-size: 13px; color: rgba(255,255,255,0.8); max-width: 85%; line-height: 1.5; }
  .bubble-user-text { background: #f97316; border-radius: 14px 14px 4px 14px; padding: 10px 14px; font-size: 13px; color: white; max-width: 85%; line-height: 1.5; }
  .coach-input-row {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
  }
  .coach-input-row input {
    flex: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.1);
    color: white;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .coach-input-row input:focus { border-color: rgba(249,115,22,0.5); }
  .send-btn {
    background: #f97316;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: #ea6c0a; }

  /* ── 퀴즈 ── */
  .quiz-wrap {
    border-top: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }
  .quiz-wrap.open { max-height: 400px; overflow-y: auto; }
  .quiz-inner { padding: 12px 16px; }
  .quiz-q { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; color: rgba(255,255,255,0.85); line-height: 1.6; }
  .quiz-blank { background: rgba(255,255,255,0.05); border: none; border-bottom: 2px solid rgba(255,255,255,0.25); color: #fb923c; width: 80px; padding: 1px 4px; outline: none; text-align: center; font-weight: 700; font-size: 13px; border-radius: 0; transition: all 0.2s; }
  .quiz-blank:focus { width: 100px; border-bottom-color: #f97316; }
  .quiz-blank.correct { border-bottom-color: #22c55e; color: #22c55e; background: rgba(34,197,94,0.08); }
  .quiz-blank.wrong { border-bottom-color: #ef4444; color: #ef4444; background: rgba(239,68,68,0.06); }
  .quiz-hint { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 4px; }
  .quiz-actions { display: flex; gap: 8px; margin-top: 10px; }
  .quiz-check-btn { flex: 1; background: #f97316; color: white; border: none; border-radius: 10px; padding: 9px; font-size: 12px; font-weight: 900; cursor: pointer; }
  .quiz-close-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); border-radius: 10px; padding: 9px 14px; font-size: 12px; font-weight: 900; cursor: pointer; }
  .quiz-score { text-align: center; font-size: 14px; font-weight: 900; color: white; margin-top: 8px; }

  /* ── 장면 이미지 ── */
  #scene-image-wrap img { width: 100%; border-radius: 12px; object-fit: cover; max-height: 160px; margin-bottom: 12px; }

  /* ── 레벨업 배너 ── */
  #levelup-banner {
    margin: 8px 16px;
    padding: 10px 14px;
    background: rgba(249,115,22,0.1);
    border: 1px solid rgba(249,115,22,0.25);
    border-radius: 12px;
    flex-shrink: 0;
    display: none;
  }
  #levelup-banner.show { display: block; }
  #levelup-banner p { font-size: 12px; color: rgba(255,255,255,0.7); font-weight: 700; margin-bottom: 8px; }
  .levelup-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .levelup-btn { font-size: 11px; font-weight: 900; padding: 6px 12px; border-radius: 8px; cursor: pointer; border: none; transition: all 0.2s; }

  /* ── 저장 목록 (좌측 하단 토글) ── */
  .saved-list-wrap {
    border-top: 1px solid rgba(255,255,255,0.06);
    flex-shrink: 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }
  .saved-list-wrap.open { max-height: 220px; overflow-y: auto; }
  .saved-inner { padding: 10px 16px; }
  .saved-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .saved-item:last-child { border-bottom: none; }
  .saved-item-img { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; flex-shrink: 0; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .saved-item-info { flex: 1; min-width: 0; }
  .saved-item-topic { font-size: 13px; font-weight: 800; color: white; truncate: ellipsis; white-space: nowrap; overflow: hidden; }
  .saved-item-meta { font-size: 10px; color: rgba(255,255,255,0.3); margin-top: 1px; }
  .saved-load-btn { font-size: 11px; font-weight: 900; padding: 4px 10px; background: rgba(249,115,22,0.15); color: #fb923c; border-radius: 6px; cursor: pointer; border: none; flex-shrink: 0; }
  .saved-del-btn { font-size: 11px; padding: 4px 8px; background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.3); border-radius: 6px; cursor: pointer; border: none; flex-shrink: 0; }
  .saved-toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-top: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; cursor: pointer; }
  .saved-toggle-row:hover { background: rgba(255,255,255,0.02); }
  .saved-toggle-label { font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.25); text-transform: uppercase; letter-spacing: 0.1em; }
</style>
{% endblock %}

{% block content %}
<div class="tb-app">

  <!-- ══ 좌측: 입력 + 결과 ══════════════════════════════════ -->
  <div class="tb-panel">
    <!-- 헤더 -->
    <div class="tb-panel-header" style="background: linear-gradient(90deg, rgba(249,115,22,0.08), transparent);">
      <span style="font-size:16px;">📖</span>
      <h2>AI 레슨 메이커 <span style="color:#f97316;font-style:italic;text-transform:none;font-size:11px;">· 나만의 맞춤 레슨</span></h2>
    </div>

    <!-- 설정 바 -->
    <div class="config-row">
      <input id="topic" type="text" value="김치" placeholder="주제 (예: 여행, 음식, 직장...)"
        onkeydown="if(event.key==='Enter'){event.preventDefault();generateContent();}" />
      <select id="level">
        <option value="초급">🟢 초급</option>
        <option value="중급" selected>🟡 중급</option>
        <option value="고급">🔴 고급</option>
      </select>
      <button id="gen-btn" class="gen-btn" onclick="toggleGeneration()">
        <span id="gen-icon">🪄</span><span id="gen-label">생성</span>
      </button>
    </div>

    <!-- 결과 영역 (스크롤) -->
    <div class="tb-scroll" id="result-scroll">
      <div id="result-placeholder" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:rgba(255,255,255,0.15);">
        <span style="font-size:48px;">✨</span>
        <p style="font-size:13px;font-weight:700;">주제를 입력하고 생성 버튼을 눌러보세요</p>
      </div>
      <div id="result-content" style="display:none;">
        <div id="scene-image-wrap" class="hidden"></div>
        <div id="dialogue-area"></div>
        <div id="vocab-area" style="margin-top:12px;"></div>
      </div>
    </div>

    <!-- 저장 목록 토글 -->
    <div class="saved-toggle-row" onclick="toggleSavedList()" id="saved-toggle-row" style="display:none;">
      <span class="saved-toggle-label">📚 내 저장 목록 <span id="saved-count"></span></span>
      <span id="saved-chevron" style="color:rgba(255,255,255,0.2);font-size:12px;">▲</span>
    </div>
    <div class="saved-list-wrap" id="saved-list-wrap">
      <div class="saved-inner" id="saved-list"></div>
    </div>
  </div>

  <!-- ══ 우측: 액션 + 코치 + 퀴즈 ══════════════════════════ -->
  <div class="tb-panel">
    <!-- 액션 버튼 바 -->
    <div class="action-bar">
      <button class="action-btn" onclick="speakDialogue()" id="btn-listen">
        <span>🔊</span><span>전체 듣기</span>
      </button>
      <button class="action-btn" onclick="generateSceneImage()" id="btn-image">
        <span>🖼️</span><span>이미지 생성</span>
      </button>
      <button class="action-btn" onclick="toggleQuiz()" id="btn-quiz">
        <span>🧩</span><span>퀴즈</span>
      </button>
      <button class="action-btn" onclick="saveTextbook()" id="btn-save">
        <span>💾</span><span>저장</span>
      </button>
    </div>

    <!-- 레벨업 배너 -->
    <div id="levelup-banner">
      <p>🎉 잘 들으셨나요! 다음 단계로 도전해보세요.</p>
      <div class="levelup-btns">
        <button id="btn-harder" class="levelup-btn" onclick="levelUpHarder()" style="background:rgba(249,115,22,0.8);color:white;">더 어렵게 ↑</button>
        <button class="levelup-btn" onclick="newTopic()" style="background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);">새 주제</button>
        <button class="levelup-btn" onclick="toggleQuiz()" style="background:rgba(139,92,246,0.3);color:#c4b5fd;">🧩 퀴즈</button>
      </div>
    </div>

    <!-- 코치 메시지 -->
    <div class="coach-scroll" id="coach-messages">
      <div class="coach-bubble-ai">
        <span style="font-size:20px;flex-shrink:0;">🤖</span>
        <div class="bubble-ai-text">교재를 생성한 후 질문해 주세요! 문법, 어휘, 문화 등 무엇이든 물어보세요.</div>
      </div>
    </div>

    <!-- 코치 입력 -->
    <div class="coach-input-row">
      <input id="coach-input" type="text" placeholder="질문을 입력하세요... 😊"
        onkeydown="if(event.key==='Enter'){event.preventDefault();sendCoach();}" />
      <button class="send-btn" onclick="sendCoach()">전송</button>
    </div>

    <!-- 퀴즈 영역 -->
    <div class="quiz-wrap" id="quiz-wrap">
      <div class="quiz-inner">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <span style="font-size:10px;font-weight:900;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:.1em;">🧩 퀴즈</span>
          <button onclick="toggleQuiz()" style="background:none;border:none;color:rgba(255,255,255,0.2);cursor:pointer;font-size:16px;">×</button>
        </div>
        <div id="quiz-questions"></div>
        <div class="quiz-actions">
          <button class="quiz-check-btn" onclick="checkAnswers()">정답 확인</button>
        </div>
        <div id="quiz-score" class="quiz-score" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<script>
  (function() {
    ["https://cdn.jsdelivr.net/npm/marked/marked.min.js","https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"].forEach(src => {
      const s = document.createElement("script"); s.src = src; s.async = true; document.head.appendChild(s);
    });
  })();

  function jsEsc(s) { return (s||"").toString().replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\"/g,'\\"').replace(/\n/g," "); }

  let isGenerating = false, abortController = null;
  let currentTopic = "", currentLevel = "중급";
  let currentDialogue = [], currentVocabulary = [];
  let currentImageUrl = null, currentAudio = null, isSpeaking = false;
  let coachHistory = [];

  // ── 생성 ────────────────────────────────────────────────────────
  function toggleGeneration() { isGenerating ? stopGeneration() : generateContent(); }

  function stopGeneration() {
    if (abortController) { abortController.abort(); abortController = null; }
    isGenerating = false; setBtnState(false);
  }

  function setBtnState(on) {
    isGenerating = on;
    document.getElementById("gen-icon").textContent = on ? "⏹️" : "🪄";
    document.getElementById("gen-label").textContent = on ? "중지" : "생성";
    document.getElementById("gen-btn").className = "gen-btn" + (on ? " stop" : "");
  }

  async function generateContent() {
    currentTopic = document.getElementById("topic").value.trim();
    currentLevel = document.getElementById("level").value;
    if (!currentTopic) return;

    abortController = new AbortController();
    setBtnState(true);
    currentImageUrl = null;
    currentDialogue = []; currentVocabulary = [];
    hideLevelUp(); hideQuiz();

    document.getElementById("result-placeholder").style.display = "none";
    document.getElementById("result-content").style.display = "block";
    document.getElementById("scene-image-wrap").innerHTML = "";
    document.getElementById("scene-image-wrap").classList.add("hidden");
    document.getElementById("dialogue-area").innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:40px 0;justify-content:center;"><div style="width:24px;height:24px;border-radius:50%;border:2px solid #f97316;border-top-color:transparent;animation:spin 0.8s linear infinite;"></div><span style="color:rgba(255,255,255,0.4);font-size:13px;font-weight:700;">AI가 교재를 만들고 있어요...</span></div>`;
    document.getElementById("vocab-area").innerHTML = "";

    const fd = new FormData();
    fd.append("topic", currentTopic); fd.append("level", currentLevel);
    fd.append("backend", "ollama"); fd.append("model", "exaone3.5:2.4b");

    try {
      const res = await fetch("/api/generate-content", { method:"POST", body:fd, signal:abortController.signal });
      const data = await res.json();

      let obj = data;
      if (data.text) {
        try { const m = data.text.match(/```(?:json)?\s*([\s\S]*?)\s*```/i); obj = JSON.parse(m ? m[1] : data.text); } catch(e) {}
      }

      if (!obj.dialogue) {
        document.getElementById("dialogue-area").innerHTML = `<pre style="font-size:11px;color:#f97316;padding:12px;">${JSON.stringify(data,null,2)}</pre>`;
        setBtnState(false); return;
      }

      currentDialogue = obj.dialogue;
      currentVocabulary = obj.vocabulary || [];

      // 대화 렌더링
      document.getElementById("dialogue-area").innerHTML = obj.dialogue.map((d, i) => `
        <div class="dialogue-card" data-text='${jsEsc(d.text)}'>
          <div style="display:flex;align-items:flex-start;gap:8px;">
            <span style="font-size:18px;flex-shrink:0;">${i%2===0?"👨‍🎓":"👩‍🏫"}</span>
            <div style="flex:1;">
              <div class="speaker">${d.speaker || (i%2===0?"Student":"Teacher")}</div>
              <div style="display:flex;align-items:center;gap:6px;margin-top:2px;">
                <button class="tts-btn" onclick="speakText('${jsEsc(d.text)}')">🔊</button>
                <span class="d-text">${d.text}</span>
              </div>
              ${d.pronunciation ? `<div class="d-pron">${d.pronunciation}</div>` : ""}
            </div>
          </div>
        </div>`).join("");

      // 어휘 렌더링
      document.getElementById("vocab-area").innerHTML = `
        <div style="font-size:10px;font-weight:900;color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;">Vocabulary</div>
        ${currentVocabulary.map(w=>`<span class="vocab-tag">${w}</span>`).join("")}`;

      setBtnState(false);
      loadSavedTextbooks();
    } catch(e) {
      if (e.name !== "AbortError") {
        document.getElementById("dialogue-area").innerHTML = `<div style="color:#f87171;font-size:13px;padding:12px;">오류: ${e.message}</div>`;
        setBtnState(false);
      }
    }
  }

  // ── TTS ─────────────────────────────────────────────────────────
  async function playTTS(text) {
    if (!text) return;
    try {
      const res = await fetch("/api/tts/generate", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text, speaker:0}) });
      const blob = await res.blob();
      const audio = new Audio(URL.createObjectURL(blob));
      currentAudio = audio; await audio.play();
      return new Promise(r => { audio.onended = r; audio.onerror = r; });
    } catch(e) { console.error(e); }
  }

  function speakText(txt) { if(currentAudio) currentAudio.pause(); playTTS(txt); }

  async function speakDialogue() {
    if (isSpeaking) { isSpeaking = false; if(currentAudio) currentAudio.pause(); document.getElementById("btn-listen").querySelector("span:first-child").textContent="🔊"; return; }
    if (!currentDialogue.length) return;
    isSpeaking = true;
    document.getElementById("btn-listen").querySelector("span:first-child").textContent="⏸️";
    const cards = [...document.querySelectorAll(".dialogue-card")];
    for (let i = 0; i < cards.length; i++) {
      if (!isSpeaking) break;
      cards.forEach(c => c.classList.remove("playing"));
      cards[i].classList.add("playing");
      cards[i].scrollIntoView({ behavior:"smooth", block:"nearest" });
      await playTTS(cards[i].dataset.text);
    }
    cards.forEach(c => c.classList.remove("playing"));
    isSpeaking = false;
    document.getElementById("btn-listen").querySelector("span:first-child").textContent="🔊";
    showLevelUp();
  }

  // ── 레벨업 ──────────────────────────────────────────────────────
  function showLevelUp() {
    const b = document.getElementById("levelup-banner");
    const harder = document.getElementById("btn-harder");
    b.classList.add("show");
    harder.style.display = currentLevel === "고급" ? "none" : "";
  }
  function hideLevelUp() { document.getElementById("levelup-banner").classList.remove("show"); }
  function levelUpHarder() {
    const lvls = ["초급","중급","고급"];
    document.getElementById("level").value = lvls[Math.min(lvls.indexOf(currentLevel)+1, 2)];
    hideLevelUp(); generateContent();
  }
  function newTopic() { document.getElementById("topic").value = ""; document.getElementById("topic").focus(); hideLevelUp(); }

  // ── 이미지 생성 ─────────────────────────────────────────────────
  async function generateSceneImage() {
    if (!currentTopic) return;
    const btn = document.getElementById("btn-image");
    btn.disabled = true;
    btn.querySelector("span:first-child").textContent = "⏳";
    try {
      const res = await fetch("/api/generate-image", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({situation:currentTopic, style:"illustration"}) });
      const data = await res.json();
      if (data.success && data.image_url) {
        currentImageUrl = data.image_url;
        const wrap = document.getElementById("scene-image-wrap");
        wrap.innerHTML = `<img src="${data.image_url}" alt="scene" />`;
        wrap.classList.remove("hidden");
        btn.querySelector("span:first-child").textContent = "🖼️";
      } else { btn.querySelector("span:first-child").textContent = "❌"; }
    } catch(e) { btn.querySelector("span:first-child").textContent = "❌"; }
    btn.disabled = false;
  }

  // ── 퀴즈 ────────────────────────────────────────────────────────
  function toggleQuiz() {
    const wrap = document.getElementById("quiz-wrap");
    const isOpen = wrap.classList.contains("open");
    if (isOpen) { wrap.classList.remove("open"); return; }
    wrap.classList.add("open");
    if (!currentDialogue.length) { document.getElementById("quiz-questions").innerHTML = `<p style="color:rgba(255,255,255,0.3);font-size:12px;">먼저 교재를 생성해주세요.</p>`; return; }
    loadQuiz();
  }
  function hideQuiz() { document.getElementById("quiz-wrap").classList.remove("open"); }

  async function loadQuiz() {
    const qDiv = document.getElementById("quiz-questions");
    document.getElementById("quiz-score").style.display = "none";
    qDiv.innerHTML = `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;color:rgba(255,255,255,0.3);font-size:12px;"><div style="width:16px;height:16px;border-radius:50%;border:2px solid #f97316;border-top-color:transparent;animation:spin 0.8s linear infinite;"></div>퀴즈 생성 중...</div>`;
    try {
      const res = await fetch("/api/textbook/quiz", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({dialogue:currentDialogue}) });
      const data = await res.json();
      const qs = data.questions || [];
      if (!qs.length) { qDiv.innerHTML = `<p style="color:rgba(255,255,255,0.3);font-size:12px;">퀴즈를 생성하지 못했습니다.</p>`; return; }
      qDiv.innerHTML = qs.map((q,i) => {
        const parts = q.display.split("___");
        return `<div class="quiz-q">Q${i+1}. ${parts[0]}<input class="quiz-blank" data-answer="${jsEsc(q.blank_word)}" placeholder="  " />${parts[1]||""}<div class="quiz-hint">💡 ${q.hint||""}</div></div>`;
      }).join("");
    } catch(e) { qDiv.innerHTML = `<p style="color:#f87171;font-size:12px;">${e.message}</p>`; }
  }

  function checkAnswers() {
    let correct = 0;
    document.querySelectorAll(".quiz-blank").forEach(b => {
      b.classList.remove("correct","wrong");
      if (b.value.trim() === b.dataset.answer.trim()) { b.classList.add("correct"); correct++; }
      else { b.classList.add("wrong"); b.setAttribute("placeholder", b.dataset.answer); }
    });
    const total = document.querySelectorAll(".quiz-blank").length;
    const sc = document.getElementById("quiz-score");
    sc.style.display = "block";
    sc.innerHTML = `${correct===total?"🎉":correct>=total/2?"👍":"💪"} <span style="color:#f97316;">${correct}</span>/${total} 정답`;
  }

  // ── 저장 ────────────────────────────────────────────────────────
  function saveTextbook() {
    if (!currentDialogue.length) return;
    const saved = JSON.parse(localStorage.getItem("saved_textbooks")||"[]");
    saved.unshift({ id:Date.now(), topic:currentTopic, level:currentLevel, dialogue:currentDialogue, vocabulary:currentVocabulary, imageUrl:currentImageUrl, savedAt:new Date().toISOString() });
    localStorage.setItem("saved_textbooks", JSON.stringify(saved.slice(0,20)));
    loadSavedTextbooks();
    document.getElementById("btn-save").querySelector("span:first-child").textContent = "✅";
    setTimeout(() => { document.getElementById("btn-save").querySelector("span:first-child").textContent = "💾"; }, 1500);
  }

  function deleteSaved(id) {
    const saved = JSON.parse(localStorage.getItem("saved_textbooks")||"[]").filter(s=>s.id!==id);
    localStorage.setItem("saved_textbooks", JSON.stringify(saved));
    loadSavedTextbooks();
  }

  function restoreSaved(id) {
    const entry = JSON.parse(localStorage.getItem("saved_textbooks")||"[]").find(s=>s.id===id);
    if (!entry) return;
    document.getElementById("topic").value = entry.topic;
    document.getElementById("level").value = entry.level;
    currentTopic = entry.topic; currentLevel = entry.level;
    currentDialogue = entry.dialogue; currentVocabulary = entry.vocabulary; currentImageUrl = entry.imageUrl;
    generateContent();
  }

  function toggleSavedList() {
    const wrap = document.getElementById("saved-list-wrap");
    const chevron = document.getElementById("saved-chevron");
    const isOpen = wrap.classList.contains("open");
    wrap.classList.toggle("open");
    chevron.textContent = isOpen ? "▲" : "▼";
  }

  function loadSavedTextbooks() {
    const saved = JSON.parse(localStorage.getItem("saved_textbooks")||"[]");
    const toggleRow = document.getElementById("saved-toggle-row");
    if (!saved.length) { toggleRow.style.display = "none"; return; }
    toggleRow.style.display = "flex";
    document.getElementById("saved-count").textContent = `(${saved.length})`;
    const lv = {"초급":"🟢","중급":"🟡","고급":"🔴"};
    document.getElementById("saved-list").innerHTML = saved.map(s => {
      const date = new Date(s.savedAt).toLocaleDateString("ko-KR",{month:"short",day:"numeric"});
      return `<div class="saved-item">
        <div class="saved-item-img">${s.imageUrl?`<img src="${s.imageUrl}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;">`:"📖"}</div>
        <div class="saved-item-info"><div class="saved-item-topic">${s.topic}</div><div class="saved-item-meta">${lv[s.level]||""} ${s.level} · ${date}</div></div>
        <button class="saved-load-btn" onclick="restoreSaved(${s.id})">불러오기</button>
        <button class="saved-del-btn" onclick="deleteSaved(${s.id})">×</button>
      </div>`;
    }).join("");
  }

  // ── AI 코치 ─────────────────────────────────────────────────────
  function appendBubble(role, html) {
    const msgs = document.getElementById("coach-messages");
    const div = document.createElement("div");
    if (role === "user") {
      div.className = "coach-bubble-user";
      div.innerHTML = `<div class="bubble-user-text">${html}</div>`;
    } else {
      div.className = "coach-bubble-ai";
      div.innerHTML = `<span style="font-size:20px;flex-shrink:0;">🤖</span><div class="bubble-ai-text">${html}</div>`;
    }
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  async function sendCoach() {
    const input = document.getElementById("coach-input");
    const prompt = input.value.trim();
    if (!prompt) return;
    input.value = "";
    appendBubble("user", prompt);
    coachHistory.push({role:"user", content:prompt});
    const typing = document.createElement("div");
    typing.className = "coach-bubble-ai"; typing.id = "coach-typing";
    typing.innerHTML = `<span style="font-size:20px;">🤖</span><div class="bubble-ai-text" style="color:rgba(255,255,255,0.3);">생각중...</div>`;
    document.getElementById("coach-messages").appendChild(typing);
    document.getElementById("coach-messages").scrollTop = 9999;
    const ctx = currentDialogue.map(d=>d.text).join("\n");
    try {
      const res = await fetch("/api/chat/test", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({prompt, backend:"ollama", model:"exaone3.5:2.4b", history:coachHistory.slice(-10), system_context:ctx}) });
      const data = await res.json();
      document.getElementById("coach-typing")?.remove();
      const reply = data.text || JSON.stringify(data);
      const safe = window.marked ? DOMPurify.sanitize(marked.parse(reply)) : reply;
      appendBubble("assistant", safe);
      coachHistory.push({role:"assistant", content:reply});
    } catch(e) {
      document.getElementById("coach-typing")?.remove();
      appendBubble("assistant", "오류: "+e.message);
    }
  }

  // ── spin 애니메이션 ─────────────────────────────────────────────
  const style = document.createElement("style");
  style.textContent = "@keyframes spin{to{transform:rotate(360deg)}}";
  document.head.appendChild(style);

  document.addEventListener("DOMContentLoaded", loadSavedTextbooks);
</script>
{% endblock %}
