<!-- 캐릭터 Pop-Up (ToastManager 대체됨) -->
<script>
  // 캐릭터 정보
  const characterInfo = {
    oppa: {
      emoji: "👦",
      name: "오빠",
    },
    tiger: {
      emoji: "🐯",
      name: "호랑이",
    },
    sister: {
      emoji: "👧",
      name: "여동생",
    },
  };

  // 팝업 데이터 저장
  let currentPopupData = null;

  /**
   * 캐릭터 팝업 표시 (ToastManager로 메시지 표시)
   * @param {Object} popupData - 백엔드에서 받은 팝업 데이터
   */
  function showCharacterPopup(popupData) {
    if (!popupData || !popupData.should_show) return;

    currentPopupData = popupData;
    const character = popupData.character;
    const charInfo = characterInfo[character];

    if (!charInfo) {
      console.error('Unknown character:', character);
      return;
    }

    // 모달 대신 토스트 메시지 표시
    const toastMessage = `${charInfo.emoji} ${charInfo.name}: ${popupData.message}`;
    if (typeof ToastManager !== 'undefined') {
      // 캐릭터 메시지는 정보성 알림으로 5초간 표시
      ToastManager.info(toastMessage, 5000);
    } else {
      console.log('Character Message:', toastMessage);
    }

    // 팝업 표시 기록 (서버에)
    recordPopupShown(popupData);
  }

  /**
   * 서버에서 팝업 트리거 확인
   */
  async function checkPopupTrigger() {
    try {
      const token = localStorage.getItem('session_token');
      if (!token) return;

      const response = await fetch('/api/learning/check-popup', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        }
      });

      if (!response.ok) return;

      const data = await response.json();
      if (data.popup) {
        showCharacterPopup(data.popup);
      }
    } catch (error) {
      console.error('팝업 확인 실패:', error);
    }
  }

  /**
   * 팝업 표시 기록
   */
  async function recordPopupShown(popupData) {
    try {
      const token = localStorage.getItem('session_token');
      if (!token) return;

      await fetch("/api/learning/popup-shown", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({
          popup_type: popupData.type,
          character: popupData.character,
          message: popupData.message,
          trigger_reason: popupData.trigger,
        }),
      });
    } catch (error) {
      console.error("팝업 기록 실패:", error);
    }
  }

  // 페이지 로드 시 팝업 확인 (로그인된 경우)
  window.addEventListener('DOMContentLoaded', function() {
    const token = localStorage.getItem('session_token');
    if (token) {
      // 3초 후에 팝업 확인 (페이지 로딩 완료 후)
      setTimeout(checkPopupTrigger, 3000);
    }
  });

  // 호환성을 위한 더미 함수들
  function closeCharacterPopup() {}
  function dismissCharacterPopup() {}
</script>
