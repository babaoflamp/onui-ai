server {
    listen 80;
    listen [::]:80;
    server_name opportunity.ai.kr www.opportunity.ai.kr onui.ai.kr www.onui.ai.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # AWS 로드밸런서에서 HTTP(80)로 트래픽을 넘기므로 무한 리다이렉트 방지를 위해 바로 9002로 프록시
    location /static/ {
        alias /home/scottk/Projects/onui-ai/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /uploads/ {
        alias /home/scottk/Projects/onui-ai/uploads/;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}


