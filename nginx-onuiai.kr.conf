server {
    listen 80;
    listen [::]:80;
    server_name onuiai.kr www.onuiai.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://opportunity.ai.kr$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name onuiai.kr www.onuiai.kr;

    ssl_certificate     /etc/letsencrypt/live/onuiai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onuiai.kr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/onuiai.kr.access.log;
    error_log  /var/log/nginx/onuiai.kr.error.log warn;

    location / {
        return 301 https://opportunity.ai.kr$request_uri;
    }
}
