server {
    listen 80;
    listen [::]:80;
    server_name onuiai.kr www.onuiai.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name onuiai.kr www.onuiai.kr;

    ssl_certificate     /etc/letsencrypt/live/onuiai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/onuiai.kr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/onuiai.kr.access.log;
    error_log  /var/log/nginx/onuiai.kr.error.log warn;

    client_max_body_size 50M;
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    location /static/ {
        alias /home/scottk/Projects/onui-ai/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /uploads/ {
        alias /home/scottk/Projects/onui-ai/uploads/;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # WebSocket — Gemini Live API (/ws/voice-call/{id})
    location /ws/ {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:9002;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
